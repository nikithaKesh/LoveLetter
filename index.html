<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Letter For You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffe6ea;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        /* Responsive Container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Envelope */
        .envelope {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 200px;
            background-color: #f48fb1;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            margin-top: 50px;
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            /* Responsive borders based on standard max-width */
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 110px solid #e91e63;
            transform-origin: top;
            transition: transform 0.6s ease-in-out;
            z-index: 4;
        }

        .envelope.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        /* Letter */
        .letter {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 180px;
            background-color: #fff;
            border-radius: 5px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.8s ease-in-out;
            z-index: 2;
            overflow-y: auto;
            color: #333;
            font-size: 16px;
            line-height: 1.5;
        }

        .envelope.open .letter {
            transform: translate(-50%, -180px);
            height: auto;
            max-height: 350px;
            z-index: 5;
        }

        /* Highlight text color */
        .highlight {
            color: #e91e63;
            font-weight: bold;
        }

        /* Envelope base parts */
        .front {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-bottom: 100px solid #d81b60;
            z-index: 3;
        }

        .side-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-left: 160px solid #ec407a;
            z-index: 3;
        }
        
        .side-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-right: 160px solid #ec407a;
            z-index: 3;
        }

        /* Buttons */
        .controls {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            z-index: 15;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-family: 'Georgia', serif;
            color: white;
            background-color: #e91e63;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #d81b60;
            transform: scale(1.05);
        }

        /* Floating Photo Frames */
        .photo-frame {
            position: absolute;
            padding: 10px 10px 30px 10px;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border-radius: 2px;
            z-index: 1;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 1s, transform 1s;
        }

        .photo-frame.visible {
            opacity: 1;
            transform: scale(1) rotate(var(--rotation));
        }

        .photo-frame img {
            width: 100px; /* Adjust size for mobile */
            height: 100px;
            object-fit: cover;
            border: 1px solid #eee;
        }

        @media (min-width: 600px) {
            .photo-frame img {
                width: 150px;
                height: 150px;
            }
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700, 0 0 20px #ffea00;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            animation: sparkle-burst 1.5s ease-out forwards;
        }

        @keyframes sparkle-burst {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
        }

    </style>
</head>
<body>

    <div id="photos-container"></div>

    <div class="container">
        <div class="envelope" id="envelope">
            <div class="flap"></div>
            <div class="side-left"></div>
            <div class="side-right"></div>
            <div class="front"></div>
            
            <div class="letter">
                <h2 style="text-align: center;">For My Love</h2>
                <div id="letter-text"></div>
            </div>
        </div>

        <div class="controls">
            <button id="openBtn">Open Envelope</button>
            <button id="closeBtn">Close</button>
        </div>
    </div>

    <script>
        const envelope = document.getElementById('envelope');
        const openBtn = document.getElementById('openBtn');
        const closeBtn = document.getElementById('closeBtn');
        const letterTextContainer = document.getElementById('letter-text');
        const photosContainer = document.getElementById('photos-container');

        let isOpen = false;
        let typingTimeout;

        // 1. ADD YOUR TEXT HERE
        // Use <span class="highlight">word</span> to highlight specific words
        const myLetterHTML = `
            My dear love, Ishara,<br><br>
            I love you so much, and I feel incredibly <span class="highlight">lucky</span> to have you as my girlfriend. Having you in my life makes everything feel <span class="highlight">brighter</span> and more <span class="highlight">meaningful</span>. Your <span class="highlight">smile</span>, your <span class="highlight">kindness</span>, and the way you care about things mean so much to me. I’m truly <span class="highlight">grateful</span> for every moment we share together.<br><br>
            I just want you to know how <span class="highlight">special</span> you are to me, and how <span class="highlight">happy</span> I am to call you mine.<br><br>
            — From your babe, Keshan
        `;

        // 2. ADD YOUR PHOTO LINKS HERE
        // Replace these URLs with links to your own pictures
        const memories = [
            'https://via.placeholder.com/150/ffb6c1/ffffff?text=Photo+1',
            'https://via.placeholder.com/150/ffc0cb/ffffff?text=Photo+2',
            'https://via.placeholder.com/150/ff69b4/ffffff?text=Photo+3',
            'https://via.placeholder.com/150/db7093/ffffff?text=Photo+4'
        ];

        // Button Listeners
        openBtn.addEventListener('click', () => {
            if (!isOpen) {
                envelope.classList.add('open');
                isOpen = true;
                
                // Clear any existing text and start typing
                letterTextContainer.innerHTML = "";
                clearTimeout(typingTimeout);
                
                // Delay typing slightly so the envelope has time to open
                setTimeout(() => {
                    typeLetter(myLetterHTML, 0, "");
                }, 800);

                createSparkles();
                showPhotos();
            }
        });

        closeBtn.addEventListener('click', () => {
            if (isOpen) {
                envelope.classList.remove('open');
                isOpen = false;
                
                // Stop typing effect
                clearTimeout(typingTimeout);
                
                hidePhotos();
            }
        });

        // Typing Effect Function (HTML Safe)
        function typeLetter(fullText, index, currentString) {
            if (index < fullText.length) {
                // If we hit an HTML tag, inject the whole tag at once so it doesn't break
                if (fullText.charAt(index) === '<') {
                    let tagEnd = fullText.indexOf('>', index);
                    currentString += fullText.substring(index, tagEnd + 1);
                    index = tagEnd + 1;
                } else {
                    currentString += fullText.charAt(index);
                    index++;
                }
                
                letterTextContainer.innerHTML = currentString;
                
                // Adjust speed here (currently 40ms per character)
                typingTimeout = setTimeout(() => {
                    typeLetter(fullText, index, currentString);
                }, 40);
            }
        }

        // Floating Photos Function
        function showPhotos() {
            photosContainer.innerHTML = ''; // clear old photos
            
            memories.forEach((src, i) => {
                const frame = document.createElement('div');
                frame.classList.add('photo-frame');
                
                const img = document.createElement('img');
                img.src = src;
                frame.appendChild(img);
                
                // Randomize positions around the screen
                const randomX = Math.floor(Math.random() * 80) + 10; // 10% to 90%
                const randomY = Math.floor(Math.random() * 80) + 10;
                // Randomize rotation between -20deg and 20deg
                const rotation = Math.floor(Math.random() * 40) - 20;

                frame.style.left = `${randomX}vw`;
                frame.style.top = `${randomY}vh`;
                frame.style.setProperty('--rotation', `${rotation}deg`);
                
                photosContainer.appendChild(frame);

                // Stagger the fade in
                setTimeout(() => {
                    frame.classList.add('visible');
                }, i * 300);
            });
        }

        function hidePhotos() {
            const frames = document.querySelectorAll('.photo-frame');
            frames.forEach(frame => {
                frame.classList.remove('visible');
            });
            setTimeout(() => {
                photosContainer.innerHTML = '';
            }, 1000);
        }

        // Sparkle Animation
        function createSparkles() {
            const envelopeRect = envelope.getBoundingClientRect();
            // Center of the envelope
            const centerX = envelopeRect.left + (envelopeRect.width / 2);
            const centerY = envelopeRect.top + (envelopeRect.height / 2);

            for (let i = 0; i < 40; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                
                sparkle.style.left = `${centerX}px`;
                sparkle.style.top = `${centerY}px`;

                // Randomize explosion directions
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 150 + 50; // Distance to travel
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                sparkle.style.setProperty('--dx', `${dx}px`);
                sparkle.style.setProperty('--dy', `${dy}px`);
                
                document.body.appendChild(sparkle);

                // Clean up sparkles after animation
                setTimeout(() => sparkle.remove(), 1500);
            }
        }
    </script>
</body>
</html>
