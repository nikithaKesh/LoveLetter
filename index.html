<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Letter For Ishara</title>
  <style>
    :root {
      --env-width: min(84vw, 430px);
      --env-height: calc(var(--env-width) * 0.64);

      --bg-1: #fff4f7;
      --bg-2: #ffdbe7;
      --bg-3: #ffc3d7;

      --pink-1: #fff0f5;
      --pink-2: #ffd9e8;
      --pink-3: #ffb6cf;
      --pink-4: #ff8db3;
      --pink-5: #f45a96;
      --pink-6: #d93d78;
      --pink-7: #b92d62;

      --text-dark: #4b2d37;
      --text-soft: #7a5060;
      --white-glass: rgba(255, 255, 255, 0.68);
      --shadow-soft: 0 10px 30px rgba(217, 61, 120, 0.12);
      --shadow-strong: 0 24px 60px rgba(185, 45, 98, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: Georgia, serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.9), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,182,207,0.4), transparent 35%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
    }

    body {
      position: relative;
      display: grid;
      place-items: center;
      transition: background 0.8s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 25%, rgba(255,255,255,0.55) 0 2px, transparent 3px),
        radial-gradient(circle at 75% 20%, rgba(255,255,255,0.45) 0 2px, transparent 3px),
        radial-gradient(circle at 30% 75%, rgba(255,255,255,0.35) 0 1.5px, transparent 3px),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.4) 0 1.5px, transparent 3px);
      opacity: 0.7;
      pointer-events: none;
      z-index: 0;
    }

    body.focus-mode {
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.95), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,141,179,0.35), transparent 35%),
        linear-gradient(135deg, #fff7fa, #ffe3ec, #ffcfe0);
    }

    #photos-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      transition: filter 0.8s ease, opacity 0.8s ease;
    }

    body.focus-mode #photos-container {
      filter: blur(7px);
      opacity: 0.45;
    }

    #hearts-container {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .envelope-wrap {
      position: relative;
      display: grid;
      place-items: center;
    }

    .tap-hint {
      position: absolute;
      bottom: -52px;
      font-family: "Times New Roman", serif;
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--text-soft);
      opacity: 0.8;
      text-transform: uppercase;
      transition: opacity 0.4s ease, transform 0.4s ease;
      user-select: none;
    }

    .envelope.open + .tap-hint {
      opacity: 0;
      transform: translateY(8px);
    }

    .envelope {
      position: relative;
      width: var(--env-width);
      height: var(--env-height);
      cursor: pointer;
      animation: float 3.6s ease-in-out infinite;
      filter: drop-shadow(0 18px 30px rgba(185, 45, 98, 0.18));
    }

    .envelope.open {
      animation: none;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background:
        linear-gradient(145deg, #ffd8e7, #ffb4ce);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.65),
        inset 0 -6px 16px rgba(185,45,98,0.08),
        var(--shadow-soft);
      overflow: hidden;
    }

    .envelope-back::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.45);
      pointer-events: none;
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: calc(var(--env-width) / 2) solid transparent;
      border-right: calc(var(--env-width) / 2) solid transparent;
      border-top: calc(var(--env-height) * 0.58) solid #ff92b8;
      transform-origin: top center;
      transition: transform 0.8s ease;
      z-index: 5;
      filter: drop-shadow(0 4px 10px rgba(185,45,98,0.1));
    }

    .flap::after {
      content: "";
      position: absolute;
      top: calc(var(--env-height) * -0.56);
      left: calc(var(--env-width) / -2 + 18px);
      width: calc(var(--env-width) - 36px);
      height: 2px;
      background: rgba(255,255,255,0.3);
      transform: rotate(0deg);
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .front {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: calc(var(--env-width) / 2) solid transparent;
      border-right: calc(var(--env-width) / 2) solid transparent;
      border-bottom: calc(var(--env-height) / 2) solid #f972a4;
      z-index: 4;
      transition: filter 0.7s ease, opacity 0.7s ease;
    }

    .side-left {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: calc(var(--env-height) / 2) solid transparent;
      border-bottom: calc(var(--env-height) / 2) solid transparent;
      border-left: calc(var(--env-width) / 2) solid #ff86b1;
      z-index: 4;
      transition: filter 0.7s ease, opacity 0.7s ease;
    }

    .side-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: calc(var(--env-height) / 2) solid transparent;
      border-bottom: calc(var(--env-height) / 2) solid transparent;
      border-right: calc(var(--env-width) / 2) solid #ff86b1;
      z-index: 4;
      transition: filter 0.7s ease, opacity 0.7s ease;
    }

    .seal {
      position: absolute;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      z-index: 6;
      background:
        radial-gradient(circle at 35% 30%, #ffb5cb, #f25a94 60%, #ca2f69);
      box-shadow:
        0 10px 18px rgba(185,45,98,0.25),
        inset 0 2px 6px rgba(255,255,255,0.35),
        inset 0 -6px 10px rgba(120,0,40,0.18);
      display: grid;
      place-items: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .seal::before {
      content: "❤";
      transform: translateY(-1px);
    }

    .envelope.open .seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.7);
    }

    body.focus-mode .front,
    body.focus-mode .side-left,
    body.focus-mode .side-right {
      filter: blur(2px);
      opacity: 0.92;
    }

    .letter {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: 90%;
      height: 72%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 24px 20px 28px;
      box-shadow:
        0 8px 20px rgba(185,45,98,0.08),
        inset 0 1px 0 rgba(255,255,255,0.75);
      border: 1px solid rgba(255,255,255,0.65);
      z-index: 2;
      color: var(--text-dark);
      overflow-y: auto;
      overflow-x: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
      transition:
        top 0.8s ease,
        left 0.8s ease,
        transform 0.8s ease,
        height 0.8s ease,
        width 0.8s ease,
        bottom 0.8s ease,
        box-shadow 0.8s ease,
        border-radius 0.8s ease;
    }

    .letter::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .envelope.open .letter {
      position: fixed;
      top: 50%;
      left: 50%;
      bottom: auto;
      transform: translate(-50%, -50%);
      width: min(92vw, 690px);
      height: min(80vh, 760px);
      max-height: 80vh;
      z-index: 50;
      border-radius: 24px;
      box-shadow: var(--shadow-strong);
      cursor: default;
    }

    .letter::before {
      content: "";
      position: absolute;
      top: 0;
      left: 28px;
      right: 28px;
      height: 10px;
      border-radius: 0 0 12px 12px;
      background: linear-gradient(to right, rgba(244,90,150,0.12), rgba(255,255,255,0.1), rgba(244,90,150,0.12));
      pointer-events: none;
    }

    .letter h2 {
      text-align: center;
      margin: 0 0 18px;
      color: var(--pink-6);
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 600;
      letter-spacing: 0.5px;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 0 12px;
      z-index: 2;
      border-bottom: 1px solid rgba(244,90,150,0.08);
    }

    #letter-text {
      font-size: clamp(15px, 2.6vw, 18px);
      line-height: 1.95;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: normal;
      color: var(--text-dark);
      padding-bottom: 12px;
    }

    .highlight {
      color: var(--pink-6);
      font-weight: 700;
    }

    .signature {
      display: inline-block;
      margin-top: 8px;
      color: var(--pink-7);
      font-style: italic;
    }

    .photo-frame {
      position: absolute;
      padding: 8px 8px 18px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.14);
      border-radius: 10px;
      opacity: 0;
      transform: scale(0.55);
      transition: opacity 0.8s ease, transform 0.8s ease;
      backdrop-filter: blur(4px);
    }

    .photo-frame.visible {
      opacity: 1;
      transform: scale(1) rotate(var(--rotation));
    }

    .photo-frame img {
      display: block;
      width: 74px;
      height: 74px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.7);
    }

    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff2a8;
      box-shadow: 0 0 10px #ffe777, 0 0 18px #fff3b2;
      opacity: 0;
      z-index: 30;
      pointer-events: none;
      animation: sparkle-burst 1.5s ease-out forwards;
    }

    @keyframes sparkle-burst {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0);
      }
    }

    .heart {
      position: absolute;
      bottom: -30px;
      opacity: 0;
      pointer-events: none;
      animation: float-heart linear forwards;
      filter: drop-shadow(0 2px 6px rgba(233, 30, 99, 0.2));
      user-select: none;
    }

    @keyframes float-heart {
      0% {
        transform: translateY(0) translateX(0) scale(0.8);
        opacity: 0;
      }
      10% {
        opacity: 0.95;
      }
      100% {
        transform: translateY(-110vh) translateX(var(--drift-x)) scale(var(--scale));
        opacity: 0;
      }
    }

    .close-tip {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-soft);
      box-shadow: 0 10px 20px rgba(0,0,0,0.06);
      border: 1px solid rgba(255,255,255,0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    body.focus-mode .close-tip {
      opacity: 1;
    }

    @media (min-width: 768px) {
      .photo-frame img {
        width: 112px;
        height: 112px;
      }
    }

    @media (max-height: 650px) {
      .envelope.open .letter {
        height: 84vh;
        max-height: 84vh;
      }
    }
  </style>
</head>
<body>
  <div id="photos-container"></div>
  <div id="hearts-container"></div>

  <div class="container">
    <div class="envelope-wrap">
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        <div class="flap"></div>
        <div class="side-left"></div>
        <div class="side-right"></div>
        <div class="front"></div>
        <div class="seal"></div>

        <div class="letter" id="letter">
          <h2>For My Love</h2>
          <div id="letter-text"></div>
        </div>
      </div>

      <div class="tap-hint">Tap to open</div>
    </div>
  </div>

  <div class="close-tip">Tap outside the letter to close</div>

  <script>
    const envelope = document.getElementById("envelope");
    const letter = document.getElementById("letter");
    const letterTextContainer = document.getElementById("letter-text");
    const photosContainer = document.getElementById("photos-container");
    const heartsContainer = document.getElementById("hearts-container");

    let isOpen = false;
    let typingTimeout;
    let heartsInterval = null;

    const myLetterHTML = `
      To my <span class="highlight">beautiful</span> Girl,<br><br>
      Nearly five years, and I still find myself wondering how I got so <span class="highlight">lucky</span>. Before you, I was a different man, wandering in the dark—but you became the <span class="highlight">light</span> that showed me the way home. You didn't just change my life; you gave it a heartbeat and a hope I never knew existed.<br><br>

      We’ve had our storms and our silent battles, our arguments and our tears, but every time the dust settles, I only see <span class="highlight">you</span>. Thank you for holding on to me, for believing in us, and for being the anchor that keeps me steady. You are my <span class="highlight">sanctuary</span>, my soul, and my forever.<br><br>

      I love you more than words can carry,<br>
      <span class="signature">Your Babe (Keshan)</span>
    `;

    const memories = [
      "WhatsApp Image 2026-03-12 at 16.30.13.jpeg",
      "WhatsApp Image 2026-03-12 at 16.30.13 (2).jpeg",
      "WhatsApp Image 2026-03-12 at 16.30.14.jpeg",
      "WhatsApp Image 2026-03-12 at 16.30.13 (1).jpeg",
      "WhatsApp Image 2026-03-12 at 16.30.12.jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.54.jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.55.jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56 (1).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56 (2).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56 (3).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56 (4).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56.jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.57 (1).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.57.jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.58 (1).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.58 (2).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.58.jpeg"
    ];

    envelope.addEventListener("click", (e) => {
      if (isOpen && e.target.closest(".letter")) return;

      if (!isOpen) {
        openLetter();
      }
    });

    document.addEventListener("click", (e) => {
      if (!isOpen) return;
      if (!e.target.closest(".letter")) {
        closeLetter();
      }
    });

    function openLetter() {
      envelope.classList.add("open");
      document.body.classList.add("focus-mode");
      isOpen = true;

      letterTextContainer.innerHTML = "";
      letter.scrollTop = 0;
      clearTimeout(typingTimeout);
      stopFloatingHearts();

      setTimeout(() => {
        typeLetter(myLetterHTML, 0, "");
      }, 650);

      createSparkles();
      showPhotos();
    }

    function closeLetter() {
      envelope.classList.remove("open");
      document.body.classList.remove("focus-mode");
      isOpen = false;

      clearTimeout(typingTimeout);
      stopFloatingHearts();
      hidePhotos();
    }

    function typeLetter(fullText, index, currentString) {
      if (index < fullText.length) {
        if (fullText.charAt(index) === "<") {
          const tagEnd = fullText.indexOf(">", index);
          currentString += fullText.substring(index, tagEnd + 1);
          index = tagEnd + 1;
        } else {
          currentString += fullText.charAt(index);
          index++;
        }

        letterTextContainer.innerHTML = currentString;
        letter.scrollTop = letter.scrollHeight;

        typingTimeout = setTimeout(() => {
          typeLetter(fullText, index, currentString);
        }, 26);
      } else {
        startFloatingHearts();
      }
    }

    function showPhotos() {
      photosContainer.innerHTML = "";

      const cols = 4;
      const rows = 5;
      const slots = [];

      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          slots.push({ c, r });
        }
      }

      slots.sort(() => Math.random() - 0.5);

      memories.forEach((src, i) => {
        const frame = document.createElement("div");
        frame.className = "photo-frame";

        const img = document.createElement("img");
        img.src = src;
        img.alt = "memory photo";
        frame.appendChild(img);

        const slot = slots[i % slots.length];
        const cellWidth = 100 / cols;
        const cellHeight = 100 / rows;

        const x = slot.c * cellWidth + Math.random() * (cellWidth - 12);
        const y = slot.r * cellHeight + Math.random() * (cellHeight - 12);
        const rotation = Math.floor(Math.random() * 30) - 15;

        frame.style.left = `${x}vw`;
        frame.style.top = `${y}vh`;
        frame.style.setProperty("--rotation", `${rotation}deg`);

        photosContainer.appendChild(frame);

        setTimeout(() => {
          frame.classList.add("visible");
        }, i * 110);
      });
    }

    function hidePhotos() {
      const frames = document.querySelectorAll(".photo-frame");
      frames.forEach((frame) => frame.classList.remove("visible"));

      setTimeout(() => {
        photosContainer.innerHTML = "";
      }, 900);
    }

    function createSparkles() {
      const rect = envelope.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < 34; i++) {
        const sparkle = document.createElement("div");
        sparkle.className = "sparkle";
        sparkle.style.left = `${centerX}px`;
        sparkle.style.top = `${centerY}px`;

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 150 + 40;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        sparkle.style.setProperty("--dx", `${dx}px`);
        sparkle.style.setProperty("--dy", `${dy}px`);

        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 1500);
      }
    }

    function startFloatingHearts() {
      stopFloatingHearts();
      heartsInterval = setInterval(createHeart, 220);
    }

    function stopFloatingHearts() {
      if (heartsInterval) {
        clearInterval(heartsInterval);
        heartsInterval = null;
      }
      heartsContainer.innerHTML = "";
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤";

      const left = Math.random() * 100;
      const duration = 4 + Math.random() * 4;
      const drift = `${Math.random() * 80 - 40}px`;
      const scale = 0.75 + Math.random() * 1.1;
      const size = 10 + Math.random() * 16;
      const colors = ["#ff4f93", "#ff7eb6", "#ff85c2", "#ff5fa2", "#ff9bc9"];

      heart.style.left = `${left}vw`;
      heart.style.fontSize = `${size}px`;
      heart.style.color = colors[Math.floor(Math.random() * colors.length)];
      heart.style.animationDuration = `${duration}s`;
      heart.style.setProperty("--drift-x", drift);
      heart.style.setProperty("--scale", scale);

      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    window.addEventListener("resize", () => {
      if (isOpen) {
        letter.scrollTop = letter.scrollHeight;
      }
    });
  </script>
</body>
</html>
