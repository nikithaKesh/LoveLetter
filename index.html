<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Letter For Ishara</title>
  <style>
    :root {
      --env-width: min(88vw, 420px);
      --env-height: calc(var(--env-width) * 0.66);
      --pink-1: #ffe6ea;
      --pink-2: #f8d7dd;
      --pink-3: #f48fb1;
      --pink-4: #ec407a;
      --pink-5: #e91e63;
      --pink-6: #d81b60;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: Georgia, serif;
      background: var(--pink-1);
    }

    body {
      position: relative;
      display: grid;
      place-items: center;
      transition: background-color 0.6s ease;
    }

    body.focus-mode {
      background: var(--pink-2);
    }

    #photos-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      transition: filter 0.8s ease, opacity 0.8s ease;
    }

    body.focus-mode #photos-container {
      filter: blur(6px);
      opacity: 0.55;
    }

    #hearts-container {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      transition: transform 0.6s ease;
    }

    body.focus-mode .container {
      transform: none;
    }

    .envelope {
      position: relative;
      width: var(--env-width);
      height: var(--env-height);
      background: var(--pink-3);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      animation: float 3s ease-in-out infinite;
      border-radius: 4px;
    }

    .envelope.open {
      animation: none;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: calc(var(--env-width) / 2) solid transparent;
      border-right: calc(var(--env-width) / 2) solid transparent;
      border-top: calc(var(--env-height) * 0.58) solid var(--pink-5);
      transform-origin: top center;
      transition: transform 0.7s ease;
      z-index: 4;
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .front {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: calc(var(--env-width) / 2) solid transparent;
      border-right: calc(var(--env-width) / 2) solid transparent;
      border-bottom: calc(var(--env-height) / 2) solid var(--pink-6);
      z-index: 3;
      transition: filter 0.7s ease, opacity 0.7s ease;
    }

    .side-left {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: calc(var(--env-height) / 2) solid transparent;
      border-bottom: calc(var(--env-height) / 2) solid transparent;
      border-left: calc(var(--env-width) / 2) solid var(--pink-4);
      z-index: 3;
      transition: filter 0.7s ease, opacity 0.7s ease;
    }

    .side-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: calc(var(--env-height) / 2) solid transparent;
      border-bottom: calc(var(--env-height) / 2) solid transparent;
      border-right: calc(var(--env-width) / 2) solid var(--pink-4);
      z-index: 3;
      transition: filter 0.7s ease, opacity 0.7s ease;
    }

    body.focus-mode .front,
    body.focus-mode .side-left,
    body.focus-mode .side-right {
      filter: blur(2px);
      opacity: 0.9;
    }

    .letter {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: 90%;
      height: 72%;
      background: #fff;
      border-radius: 14px;
      padding: 22px 18px 26px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      z-index: 2;
      color: #333;
      overflow-y: auto;
      overflow-x: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
      transition:
        top 0.8s ease,
        left 0.8s ease,
        transform 0.8s ease,
        height 0.8s ease,
        width 0.8s ease,
        bottom 0.8s ease,
        box-shadow 0.8s ease;
    }

    .letter::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .envelope.open .letter {
      position: fixed;
      top: 50%;
      left: 50%;
      bottom: auto;
      transform: translate(-50%, -50%);
      width: min(92vw, 650px);
      height: min(78vh, 720px);
      max-height: 78vh;
      z-index: 50;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      cursor: default;
    }

    .letter h2 {
      text-align: center;
      margin: 0 0 14px;
      color: var(--pink-5);
      font-size: clamp(20px, 4vw, 28px);
      position: sticky;
      top: 0;
      background: #fff;
      padding-bottom: 8px;
      z-index: 2;
    }

    #letter-text {
      font-size: clamp(15px, 2.8vw, 18px);
      line-height: 1.8;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: normal;
      padding-bottom: 10px;
    }

    .highlight {
      color: var(--pink-5);
      font-weight: bold;
    }

    .photo-frame {
      position: absolute;
      padding: 6px 6px 16px;
      background: #fff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
      border-radius: 4px;
      opacity: 0;
      transform: scale(0.55);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .photo-frame.visible {
      opacity: 1;
      transform: scale(1) rotate(var(--rotation));
    }

    .photo-frame img {
      display: block;
      width: 72px;
      height: 72px;
      object-fit: cover;
      border: 1px solid #eee;
    }

    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: gold;
      box-shadow: 0 0 10px gold, 0 0 18px #ffea00;
      opacity: 0;
      z-index: 30;
      pointer-events: none;
      animation: sparkle-burst 1.5s ease-out forwards;
    }

    @keyframes sparkle-burst {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0);
      }
    }

    .heart {
      position: absolute;
      bottom: -30px;
      opacity: 0;
      pointer-events: none;
      animation: float-heart linear forwards;
      filter: drop-shadow(0 2px 6px rgba(233, 30, 99, 0.25));
      user-select: none;
    }

    @keyframes float-heart {
      0% {
        transform: translateY(0) translateX(0) scale(0.8);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-110vh) translateX(var(--drift-x)) scale(var(--scale));
        opacity: 0;
      }
    }

    @media (min-width: 768px) {
      .photo-frame {
        padding: 8px 8px 22px;
      }

      .photo-frame img {
        width: 110px;
        height: 110px;
      }
    }

    @media (max-height: 650px) {
      .envelope.open .letter {
        height: 84vh;
        max-height: 84vh;
      }
    }
  </style>
</head>
<body>
  <div id="photos-container"></div>
  <div id="hearts-container"></div>

  <div class="container">
    <div class="envelope" id="envelope">
      <div class="flap"></div>
      <div class="side-left"></div>
      <div class="side-right"></div>
      <div class="front"></div>

      <div class="letter" id="letter">
        <h2>For My Love</h2>
        <div id="letter-text"></div>
      </div>
    </div>
  </div>

  <script>
    const envelope = document.getElementById("envelope");
    const letter = document.getElementById("letter");
    const letterTextContainer = document.getElementById("letter-text");
    const photosContainer = document.getElementById("photos-container");
    const heartsContainer = document.getElementById("hearts-container");

    let isOpen = false;
    let typingTimeout;
    let heartsInterval = null;

    const myLetterHTML = `
      My dear love, Ishara,<br><br>
      I love you so much, and I feel incredibly <span class="highlight">lucky</span> to have you as my girlfriend. Having you in my life makes everything feel <span class="highlight">brighter</span> and more <span class="highlight">meaningful</span>. Your <span class="highlight">smile</span>, your <span class="highlight">kindness</span>, and the way you care about things mean so much to me. I’m truly <span class="highlight">grateful</span> for every moment we share together.<br><br>
      I just want you to know how <span class="highlight">special</span> you are to me, and how <span class="highlight">happy</span> I am to call you mine.<br><br>
      No matter how long the message becomes, this letter will still stay readable and fit nicely on the screen. It can scroll inside smoothly without showing any visible scrollbar, so the design stays clean and romantic.<br><br>
      — From your babe, Keshan
    `;

    const memories = [
      "WhatsApp Image 2026-03-12 at 16.30.13.jpeg",
      "WhatsApp Image 2026-03-12 at 16.30.13 (2).jpeg",
      "WhatsApp Image 2026-03-12 at 16.30.14.jpeg",
      "WhatsApp Image 2026-03-12 at 16.30.13 (1).jpeg",
      "WhatsApp Image 2026-03-12 at 16.30.12.jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.54.jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.55.jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56 (1).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56 (2).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56 (3).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56 (4).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56.jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.57 (1).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.57.jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.58 (1).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.58 (2).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.58.jpeg"
    ];

    envelope.addEventListener("click", (e) => {
      if (e.target.closest(".letter") && isOpen) return;

      if (!isOpen) {
        openLetter();
      } else {
        closeLetter();
      }
    });

    function openLetter() {
      envelope.classList.add("open");
      document.body.classList.add("focus-mode");
      isOpen = true;

      letterTextContainer.innerHTML = "";
      letter.scrollTop = 0;
      clearTimeout(typingTimeout);
      stopFloatingHearts();

      setTimeout(() => {
        typeLetter(myLetterHTML, 0, "");
      }, 650);

      createSparkles();
      showPhotos();
    }

    function closeLetter() {
      envelope.classList.remove("open");
      document.body.classList.remove("focus-mode");
      isOpen = false;

      clearTimeout(typingTimeout);
      stopFloatingHearts();
      hidePhotos();
    }

    function typeLetter(fullText, index, currentString) {
      if (index < fullText.length) {
        if (fullText.charAt(index) === "<") {
          const tagEnd = fullText.indexOf(">", index);
          currentString += fullText.substring(index, tagEnd + 1);
          index = tagEnd + 1;
        } else {
          currentString += fullText.charAt(index);
          index++;
        }

        letterTextContainer.innerHTML = currentString;
        letter.scrollTop = letter.scrollHeight;

        typingTimeout = setTimeout(() => {
          typeLetter(fullText, index, currentString);
        }, 28);
      } else {
        startFloatingHearts();
      }
    }

    function showPhotos() {
      photosContainer.innerHTML = "";

      const cols = 4;
      const rows = 5;
      const slots = [];

      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          slots.push({ c, r });
        }
      }

      slots.sort(() => Math.random() - 0.5);

      memories.forEach((src, i) => {
        const frame = document.createElement("div");
        frame.className = "photo-frame";

        const img = document.createElement("img");
        img.src = src;
        img.alt = "memory photo";
        frame.appendChild(img);

        const slot = slots[i % slots.length];
        const cellWidth = 100 / cols;
        const cellHeight = 100 / rows;

        const x = slot.c * cellWidth + Math.random() * (cellWidth - 12);
        const y = slot.r * cellHeight + Math.random() * (cellHeight - 12);
        const rotation = Math.floor(Math.random() * 40) - 20;

        frame.style.left = `${x}vw`;
        frame.style.top = `${y}vh`;
        frame.style.setProperty("--rotation", `${rotation}deg`);

        photosContainer.appendChild(frame);

        setTimeout(() => {
          frame.classList.add("visible");
        }, i * 120);
      });
    }

    function hidePhotos() {
      const frames = document.querySelectorAll(".photo-frame");
      frames.forEach((frame) => frame.classList.remove("visible"));

      setTimeout(() => {
        photosContainer.innerHTML = "";
      }, 900);
    }

    function createSparkles() {
      const rect = envelope.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < 36; i++) {
        const sparkle = document.createElement("div");
        sparkle.className = "sparkle";
        sparkle.style.left = `${centerX}px`;
        sparkle.style.top = `${centerY}px`;

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 140 + 50;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        sparkle.style.setProperty("--dx", `${dx}px`);
        sparkle.style.setProperty("--dy", `${dy}px`);

        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 1500);
      }
    }

    function startFloatingHearts() {
      stopFloatingHearts();

      heartsInterval = setInterval(() => {
        createHeart();
      }, 220);
    }

    function stopFloatingHearts() {
      if (heartsInterval) {
        clearInterval(heartsInterval);
        heartsInterval = null;
      }

      heartsContainer.innerHTML = "";
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "&#10084;";

      const left = Math.random() * 100;
      const duration = 4 + Math.random() * 4;
      const drift = `${Math.random() * 80 - 40}px`;
      const scale = 0.7 + Math.random() * 1.1;
      const size = 10 + Math.random() * 16;
      const colors = ["#ff4f93", "#ff7eb6", "#ff85c2", "#ff5fa2"];

      heart.style.left = `${left}vw`;
      heart.style.fontSize = `${size}px`;
      heart.style.color = colors[Math.floor(Math.random() * colors.length)];
      heart.style.animationDuration = `${duration}s`;
      heart.style.setProperty("--drift-x", drift);
      heart.style.setProperty("--scale", scale);

      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    window.addEventListener("resize", () => {
      if (isOpen) {
        letter.scrollTop = letter.scrollHeight;
      }
    });
  </script>
</body>
</html>
