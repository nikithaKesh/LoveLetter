<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Letter For Ishara</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --env-width: min(84vw, 430px);
      --env-height: calc(var(--env-width) * 0.64);

      --bg-1: #fff6fa;
      --bg-2: #ffe2ec;
      --bg-3: #ffcfe0;
      --bg-4: #ffbfd7;

      --pink-1: #fff3f7;
      --pink-2: #ffd9e8;
      --pink-3: #ffbdd4;
      --pink-4: #ff97bc;
      --pink-5: #f35c97;
      --pink-6: #d93d78;
      --pink-7: #af2459;
      --gold-1: #ffe7a6;
      --gold-2: #e7b85f;

      --text-dark: #482b35;
      --text-soft: #78515f;
      --shadow-soft: 0 10px 30px rgba(217, 61, 120, 0.12);
      --shadow-strong: 0 24px 60px rgba(185, 45, 98, 0.22);
      --glass: rgba(255,255,255,0.72);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: "Cormorant Garamond", Georgia, serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.92), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,182,207,0.36), transparent 35%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-4));
    }

    body {
      position: relative;
      display: grid;
      place-items: center;
      transition: background 0.9s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,0.55) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 22%, rgba(255,255,255,0.45) 0 2px, transparent 3px),
        radial-gradient(circle at 28% 75%, rgba(255,255,255,0.38) 0 2px, transparent 3px),
        radial-gradient(circle at 75% 72%, rgba(255,255,255,0.32) 0 2px, transparent 3px);
      opacity: 0.75;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: -10%;
      background:
        radial-gradient(circle at 15% 25%, rgba(255, 185, 211, 0.28), transparent 18%),
        radial-gradient(circle at 85% 20%, rgba(255, 220, 232, 0.34), transparent 16%),
        radial-gradient(circle at 20% 85%, rgba(255, 192, 219, 0.25), transparent 18%),
        radial-gradient(circle at 80% 80%, rgba(255, 170, 205, 0.22), transparent 18%);
      filter: blur(35px);
      animation: bgFloat 12s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes bgFloat {
      from { transform: translateY(0px) translateX(0px) scale(1); }
      to { transform: translateY(-10px) translateX(6px) scale(1.03); }
    }

    body.focus-mode {
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.98), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,141,179,0.30), transparent 35%),
        linear-gradient(135deg, #fff8fb, #ffe7ef, #ffd7e5);
    }

    #photos-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      transition: filter 0.9s ease, opacity 0.9s ease;
    }

    body.focus-mode #photos-container {
      filter: blur(8px);
      opacity: 0.42;
    }

    #hearts-container {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    #ending-glow {
      position: fixed;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
      z-index: 58;
      text-align: center;
      color: var(--pink-7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #ending-glow.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    #ending-glow .line {
      width: 120px;
      height: 2px;
      margin: 0 auto 10px;
      background: linear-gradient(to right, transparent, rgba(243,92,151,0.7), transparent);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(243,92,151,0.28);
    }

    #ending-glow .text {
      font-family: "Great Vibes", cursive;
      font-size: clamp(24px, 4vw, 38px);
      text-shadow: 0 4px 12px rgba(255,255,255,0.45);
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .envelope-wrap {
      position: relative;
      display: grid;
      place-items: center;
    }

    .tap-hint {
      position: absolute;
      bottom: -56px;
      font-family: "Inter", sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--text-soft);
      opacity: 0.88;
      text-transform: uppercase;
      transition: opacity 0.4s ease, transform 0.4s ease;
      user-select: none;
    }

    .envelope.open + .tap-hint {
      opacity: 0;
      transform: translateY(8px);
    }

    .envelope {
      position: relative;
      width: var(--env-width);
      height: var(--env-height);
      cursor: pointer;
      animation: float 3.8s ease-in-out infinite;
      filter: drop-shadow(0 18px 30px rgba(185, 45, 98, 0.18));
      transition: transform 0.45s ease, filter 0.45s ease;
    }

    .envelope:hover {
      transform: scale(1.015);
      filter: drop-shadow(0 22px 36px rgba(185, 45, 98, 0.22));
    }

    .envelope.open,
    .envelope.open:hover {
      animation: none;
      transform: scale(1);
    }

    .envelope.opening .seal {
      animation: sealPop 0.35s ease forwards;
    }

    @keyframes sealPop {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-50%, -50%) scale(0.76); opacity: 0; }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background:
        linear-gradient(145deg, #ffd9e7, #ffb4ce);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.65),
        inset 0 -6px 16px rgba(185,45,98,0.08),
        var(--shadow-soft);
      overflow: hidden;
    }

    .envelope-back::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.45);
      pointer-events: none;
    }

    .envelope-back::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255,255,255,0.16) 0%, transparent 30%, transparent 70%, rgba(255,255,255,0.10) 100%),
        repeating-linear-gradient(
          -45deg,
          rgba(255,255,255,0.035) 0px,
          rgba(255,255,255,0.035) 2px,
          transparent 2px,
          transparent 8px
        );
      pointer-events: none;
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: calc(var(--env-width) / 2) solid transparent;
      border-right: calc(var(--env-width) / 2) solid transparent;
      border-top: calc(var(--env-height) * 0.58) solid #ff93b9;
      transform-origin: top center;
      transition: transform 0.8s cubic-bezier(.2,.75,.25,1);
      z-index: 5;
      filter: drop-shadow(0 4px 10px rgba(185,45,98,0.12));
    }

    .flap::before {
      content: "";
      position: absolute;
      top: calc(var(--env-height) * -0.57);
      left: calc(var(--env-width) / -2);
      width: 0;
      height: 0;
      border-left: calc(var(--env-width) / 2) solid transparent;
      border-right: calc(var(--env-width) / 2) solid transparent;
      border-top: calc(var(--env-height) * 0.58) solid rgba(255,255,255,0.12);
      mix-blend-mode: screen;
    }

    .flap::after {
      content: "";
      position: absolute;
      top: calc(var(--env-height) * -0.56);
      left: calc(var(--env-width) / -2 + 18px);
      width: calc(var(--env-width) - 36px);
      height: 2px;
      background: rgba(255,255,255,0.3);
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .front {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: calc(var(--env-width) / 2) solid transparent;
      border-right: calc(var(--env-width) / 2) solid transparent;
      border-bottom: calc(var(--env-height) / 2) solid #f973a6;
      z-index: 4;
      transition: filter 0.7s ease, opacity 0.7s ease;
    }

    .side-left {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: calc(var(--env-height) / 2) solid transparent;
      border-bottom: calc(var(--env-height) / 2) solid transparent;
      border-left: calc(var(--env-width) / 2) solid #ff88b3;
      z-index: 4;
      transition: filter 0.7s ease, opacity 0.7s ease;
    }

    .side-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: calc(var(--env-height) / 2) solid transparent;
      border-bottom: calc(var(--env-height) / 2) solid transparent;
      border-right: calc(var(--env-width) / 2) solid #ff88b3;
      z-index: 4;
      transition: filter 0.7s ease, opacity 0.7s ease;
    }

    .seal {
      position: absolute;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      width: 76px;
      height: 76px;
      border-radius: 50%;
      z-index: 6;
      background:
        radial-gradient(circle at 35% 30%, #ffcadb, #f25a94 58%, #bf2b62);
      box-shadow:
        0 10px 18px rgba(185,45,98,0.25),
        inset 0 2px 6px rgba(255,255,255,0.35),
        inset 0 -6px 10px rgba(120,0,40,0.18);
      display: grid;
      place-items: center;
      color: white;
      transition: transform 0.5s ease, opacity 0.5s ease;
      overflow: hidden;
    }

    .seal::before {
      content: "I♡K";
      font-family: "Cormorant Garamond", serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }

    .seal::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px dashed rgba(255,255,255,0.28);
      pointer-events: none;
    }

    .envelope:not(.open) .seal {
      animation: sealPulse 2.5s ease-in-out infinite;
    }

    @keyframes sealPulse {
      0%,100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.03); }
    }

    .envelope.open .seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.7);
    }

    body.focus-mode .front,
    body.focus-mode .side-left,
    body.focus-mode .side-right {
      filter: blur(2px);
      opacity: 0.92;
    }

    .letter {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: 90%;
      height: 72%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 22px;
      padding: 24px 20px 28px;
      box-shadow:
        0 8px 20px rgba(185,45,98,0.08),
        inset 0 1px 0 rgba(255,255,255,0.75);
      border: 1px solid rgba(255,255,255,0.65);
      z-index: 2;
      color: var(--text-dark);
      overflow-y: auto;
      overflow-x: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
      transition:
        top 0.9s cubic-bezier(.2,.75,.25,1),
        left 0.9s cubic-bezier(.2,.75,.25,1),
        transform 0.9s cubic-bezier(.2,.75,.25,1),
        height 0.9s cubic-bezier(.2,.75,.25,1),
        width 0.9s cubic-bezier(.2,.75,.25,1),
        bottom 0.9s cubic-bezier(.2,.75,.25,1),
        box-shadow 0.9s ease,
        border-radius 0.9s ease,
        opacity 0.5s ease;
    }

    .letter::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .envelope.open .letter {
      position: fixed;
      top: 50%;
      left: 50%;
      bottom: auto;
      transform: translate(-50%, -50%);
      width: min(92vw, 690px);
      height: min(80vh, 760px);
      max-height: 80vh;
      z-index: 50;
      border-radius: 26px;
      box-shadow: var(--shadow-strong);
      cursor: default;
    }

    .letter::before {
      content: "";
      position: absolute;
      top: 0;
      left: 28px;
      right: 28px;
      height: 10px;
      border-radius: 0 0 12px 12px;
      background: linear-gradient(to right, rgba(244,90,150,0.12), rgba(255,255,255,0.1), rgba(244,90,150,0.12));
      pointer-events: none;
    }

    .letter::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 31px,
          rgba(243,92,151,0.035) 32px
        );
      opacity: 0.35;
      pointer-events: none;
      border-radius: inherit;
    }

    .letter h2 {
      text-align: center;
      margin: 0 0 18px;
      color: var(--pink-6);
      font-family: "Playfair Display", "Cormorant Garamond", serif;
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 700;
      letter-spacing: 0.4px;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 0 12px;
      z-index: 2;
      border-bottom: 1px solid rgba(244,90,150,0.08);
    }

    #letter-text {
      position: relative;
      font-size: clamp(17px, 2.5vw, 21px);
      line-height: 1.8;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: normal;
      color: var(--text-dark);
      padding-bottom: 18px;
      z-index: 1;
      min-height: 120px;
    }

    .typing-cursor {
      display: inline-block;
      width: 1ch;
      color: var(--pink-6);
      animation: blinkCursor 0.9s steps(1) infinite;
    }

    @keyframes blinkCursor {
      50% { opacity: 0; }
    }

    .highlight {
      color: var(--pink-6);
      font-weight: 700;
    }

    .signature {
      display: inline-block;
      margin-top: 8px;
      color: var(--pink-7);
      font-family: "Great Vibes", cursive;
      font-size: 34px;
      line-height: 1.2;
      text-shadow: 0 2px 8px rgba(255,255,255,0.4);
    }

    .photo-frame {
      position: absolute;
      padding: 8px 8px 18px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.14);
      border-radius: 12px;
      opacity: 0;
      transform: scale(0.55);
      transition: opacity 0.9s ease, transform 0.9s ease;
      backdrop-filter: blur(4px);
      animation: photoDrift 7s ease-in-out infinite alternate;
    }

    @keyframes photoDrift {
      from { transform: translateY(0px) rotate(var(--rotation)) scale(var(--frame-scale, 1)); }
      to { transform: translateY(-6px) rotate(calc(var(--rotation) + 1deg)) scale(var(--frame-scale, 1)); }
    }

    .photo-frame.visible {
      opacity: 1;
    }

    .photo-frame img {
      display: block;
      width: var(--img-size, 74px);
      height: var(--img-size, 74px);
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.7);
    }

    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff2a8;
      box-shadow: 0 0 10px #ffe777, 0 0 18px #fff3b2;
      opacity: 0;
      z-index: 30;
      pointer-events: none;
      animation: sparkle-burst 1.5s ease-out forwards;
    }

    @keyframes sparkle-burst {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0);
      }
    }

    .heart {
      position: absolute;
      bottom: -30px;
      opacity: 0;
      pointer-events: none;
      animation: float-heart linear forwards;
      filter: drop-shadow(0 2px 6px rgba(233, 30, 99, 0.2));
      user-select: none;
    }

    @keyframes float-heart {
      0% {
        transform: translateY(0) translateX(0) scale(0.8);
        opacity: 0;
      }
      10% {
        opacity: 0.95;
      }
      100% {
        transform: translateY(-110vh) translateX(var(--drift-x)) scale(var(--scale));
        opacity: 0;
      }
    }

    .close-tip {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: "Inter", sans-serif;
      font-size: 11px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--text-soft);
      box-shadow: 0 10px 20px rgba(0,0,0,0.06);
      border: 1px solid rgba(255,255,255,0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    body.focus-mode .close-tip {
      opacity: 1;
    }

    @media (min-width: 768px) {
      .photo-frame img {
        width: var(--img-size, 112px);
        height: var(--img-size, 112px);
      }
    }

    @media (max-height: 650px) {
      .envelope.open .letter {
        height: 84vh;
        max-height: 84vh;
      }
    }

    @media (max-width: 640px) {
      .tap-hint {
        bottom: -48px;
        font-size: 11px;
      }

      .signature {
        font-size: 30px;
      }

      #ending-glow {
        bottom: 92px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="photos-container"></div>
  <div id="hearts-container"></div>

  <div class="container">
    <div class="envelope-wrap">
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        <div class="flap"></div>
        <div class="side-left"></div>
        <div class="side-right"></div>
        <div class="front"></div>
        <div class="seal"></div>

        <div class="letter" id="letter">
          <h2>For My Love</h2>
          <div id="letter-text"></div>
        </div>
      </div>

      <div class="tap-hint">Tap to open</div>
    </div>
  </div>

  <div class="close-tip">Tap outside the letter to close</div>

  <div id="ending-glow">
    <div class="line"></div>
    <div class="text">Forever yours</div>
  </div>

  <script>

    let isOpen = false;
    let typingTimeout;

      I love you more than words can carry,<br>

      "WhatsApp Image 2026-03-12 at 16.51.55.jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56 (1).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56 (2).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56 (3).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56 (4).jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.56.jpeg",
      "WhatsApp Image 2026-03-12 at 16.51.57 (1).jpeg",

    envelope.addEventListener("click", (e) => {
      e.stopPropagation();

      }

    letter.addEventListener("click", (e) => {

    });

    document.addEventListener("click", (e) => {
      if (!isOpen) return;
      if (!e.target.closest(".envelope")) {
        closeLetter();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && isOpen) {
        closeLetter();
      }
    });

    letter.addEventListener("touchstart", (e) => {
      if (!isOpen) return;
      startY = e.touches[0].clientY;
      currentY = startY;
    }, { passive: true });

    letter.addEventListener("touchmove", (e) => {
      if (!isOpen) return;
      currentY = e.touches[0].clientY;
    }, { passive: true });

    letter.addEventListener("touchend", () => {
      if (!isOpen) return;
      const delta = currentY - startY;
      const atTop = letter.scrollTop <= 5;

      if (delta > 90 && atTop) {
        closeLetter();
      }
    });

    function openLetter() {
      isOpen = true;
      endingGlow.classList.remove("show");
      stopFloatingHearts();
      letterTextContainer.innerHTML = "";

      envelope.classList.add("opening");
      document.body.classList.add("focus-mode");

      setTimeout(() => {
        envelope.classList.add("open");
        letter.scrollTop = 0;
        createSparkles();
        showPhotos();
      }, 220);

      setTimeout(() => {
        envelope.classList.remove("opening");
        typeLetter(myLetterHTML, 0, "");
      }, 820);
    }

    function closeLetter() {
      envelope.classList.remove("opening");
      envelope.classList.remove("open");
      document.body.classList.remove("focus-mode");
      endingGlow.classList.remove("show");
      isOpen = false;

      clearTimeout(typingTimeout);
      stopFloatingHearts();
      hidePhotos();
      letterTextContainer.innerHTML = "";
    }

    function typeLetter(fullText, index, currentString) {
      if (index < fullText.length) {
        if (fullText.charAt(index) === "<") {
          const tagEnd = fullText.indexOf(">", index);
          currentString += fullText.substring(index, tagEnd + 1);
          index = tagEnd + 1;
        } else {
          currentString += fullText.charAt(index);
          index++;
        }

        letterTextContainer.innerHTML = currentString + '<span class="typing-cursor">|</span>';
        letter.scrollTop = letter.scrollHeight;

        let delay = 24;
        const prevChar = fullText.charAt(index - 1);

        if (prevChar === "." || prevChar === "!" || prevChar === "?") delay = 110;
        else if (prevChar === "," || prevChar === ";") delay = 65;
        else if (prevChar === " ") delay = 14;
        else delay = 24 + Math.random() * 18;

        typingTimeout = setTimeout(() => {
          typeLetter(fullText, index, currentString);
        }, delay);
      } else {
        letterTextContainer.innerHTML = currentString;
        startFloatingHearts();
        showEndingEffect();
      }
    }

    function showPhotos() {
      photosContainer.innerHTML = "";

      const isMobile = window.innerWidth < 640;
      const count = isMobile ? Math.min(10, memories.length) : memories.length;

      const cols = isMobile ? 3 : 4;
      const rows = isMobile ? 4 : 5;
      const slots = [];

      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          slots.push({ c, r });
        }
      }

      slots.sort(() => Math.random() - 0.5);

      memories.slice(0, count).forEach((src, i) => {
        const frame = document.createElement("div");
        frame.className = "photo-frame";

        const img = document.createElement("img");
        img.src = src;
        img.alt = `memory photo ${i + 1}`;
        img.loading = "eager";
        frame.appendChild(img);

        const slot = slots[i % slots.length];
        const cellWidth = 100 / cols;
        const cellHeight = 100 / rows;

        const x = slot.c * cellWidth + Math.random() * (cellWidth - 14);
        const y = slot.r * cellHeight + Math.random() * (cellHeight - 14);
        const rotation = Math.floor(Math.random() * 24) - 12;
        const size = isMobile
          ? 58 + Math.random() * 28
          : 74 + Math.random() * 46;
        const scale = 0.94 + Math.random() * 0.2;

        frame.style.left = `${x}vw`;
        frame.style.top = `${y}vh`;
        frame.style.setProperty("--rotation", `${rotation}deg`);
        frame.style.setProperty("--img-size", `${size}px`);
        frame.style.setProperty("--frame-scale", scale);

        photosContainer.appendChild(frame);

        setTimeout(() => {
          frame.classList.add("visible");
        }, i * 120);
      });
    }

    function hidePhotos() {
      const frames = document.querySelectorAll(".photo-frame");
      frames.forEach((frame) => frame.classList.remove("visible"));

      setTimeout(() => {
        photosContainer.innerHTML = "";
      }, 950);
    }

    function createSparkles() {
      const rect = envelope.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < 38; i++) {
        const sparkle = document.createElement("div");
        sparkle.className = "sparkle";
        sparkle.style.left = `${centerX}px`;
        sparkle.style.top = `${centerY}px`;

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 160 + 45;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        sparkle.style.setProperty("--dx", `${dx}px`);
        sparkle.style.setProperty("--dy", `${dy}px`);

        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 1500);
      }
    }

    function startFloatingHearts() {
      stopFloatingHearts();
      heartsInterval = setInterval(createHeart, 220);
    }

    function stopFloatingHearts() {
      if (heartsInterval) {
        clearInterval(heartsInterval);
        heartsInterval = null;
      }
      heartsContainer.innerHTML = "";
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤";

      const left = Math.random() * 100;
      const duration = 4 + Math.random() * 4;
      const drift = `${Math.random() * 80 - 40}px`;
      const scale = 0.75 + Math.random() * 1.1;
      const size = 10 + Math.random() * 16;
      const colors = ["#ff4f93", "#ff7eb6", "#ff85c2", "#ff5fa2", "#ff9bc9"];

      heart.style.left = `${left}vw`;
      heart.style.fontSize = `${size}px`;
      heart.style.color = colors[Math.floor(Math.random() * colors.length)];
      heart.style.animationDuration = `${duration}s`;
      heart.style.setProperty("--drift-x", drift);
      heart.style.setProperty("--scale", scale);

      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    function showEndingEffect() {
      setTimeout(() => {
        endingGlow.classList.add("show");
      }, 350);
    }

    window.addEventListener("resize", () => {
      if (isOpen) {
        letter.scrollTop = letter.scrollHeight;
      }
    });
  </script>
</body>
</html>
