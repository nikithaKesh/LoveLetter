<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Letter For You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffe6ea; /* Light pink background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        .container {
            position: relative;
            z-index: 10;
        }

        /* Envelope Construction */
        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #f48fb1;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .envelope:hover {
            transform: translateY(-5px);
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 100px solid #e91e63;
            transform-origin: top;
            transition: transform 0.6s ease-in-out;
            z-index: 4;
        }

        .envelope.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        /* The Letter */
        .letter {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 180px;
            background-color: #fff;
            border-radius: 5px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.8s ease-in-out;
            z-index: 2;
            overflow-y: auto;
            text-align: center;
            color: #333;
        }

        .envelope.open .letter {
            transform: translate(-50%, -200px); /* Slides the letter up */
            height: auto;
            max-height: 400px;
            z-index: 5;
        }

        /* Envelope Shadows and Flaps */
        .front {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 100px solid #d81b60;
            z-index: 3;
        }

        .side-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-left: 150px solid #ec407a;
            z-index: 3;
        }
        
        .side-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-right: 150px solid #ec407a;
            z-index: 3;
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            bottom: -50px;
            width: 20px;
            height: 20px;
            background-color: #ff4d6d;
            transform: rotate(-45deg);
            animation: floatUp 4s ease-in infinite;
            z-index: 1;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff4d6d;
            border-radius: 50%;
        }

        .heart::before {
            top: -10px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 10px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(-45deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(-45deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="envelope" id="envelope">
            <div class="flap"></div>
            <div class="side-left"></div>
            <div class="side-right"></div>
            <div class="front"></div>
            
            <div class="letter">
                <h2>For My Love</h2>
                <p>Replace this text with your writings for her.</p>
                <p>You can add as many paragraphs as you like here. The letter is set to expand and scroll automatically so she can read the whole thing.</p>
            </div>
        </div>
    </div>

    <script>
        const envelope = document.getElementById('envelope');
        let isOpen = false;
        let heartInterval;

        // Toggle envelope state on click
        envelope.addEventListener('click', () => {
            if (!isOpen) {
                envelope.classList.add('open');
                startHearts();
                isOpen = true;
            } else {
                envelope.classList.remove('open');
                stopHearts();
                isOpen = false;
            }
        });

        // Generate the cute background effect
        function startHearts() {
            heartInterval = setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                
                // Randomize starting position and animation speed
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = Math.random() * 2 + 3 + 's';
                
                document.body.appendChild(heart);

                // Clean up DOM after animation completes
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 300);
        }

        // Stop the background effect
        function stopHearts() {
            clearInterval(heartInterval);
            const hearts = document.querySelectorAll('.heart');
            hearts.forEach(h => h.remove());
        }
    </script>
</body>
</html>
